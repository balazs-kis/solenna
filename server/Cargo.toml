[package]
name = "solenna"
version = "0.1.0"
edition = "2024"
# Edition 2024 let-chains (web.rs) need 1.88.
rust-version = "1.88"

[dependencies]
axum = "0.8.9"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
