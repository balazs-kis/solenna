[package]
name = "solenna"
version = "1.0.0"
edition = "2024"
# Minimum supported Rust: rusqlite 0.41 needs 1.89.
rust-version = "1.89"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
