[package]
name = "solenna"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust: rusqlite 0.41 needs 1.89.
rust-version = "1.89"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
