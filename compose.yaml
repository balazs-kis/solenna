# Runs the image that .github/workflows/release.yml publishes; nothing is built here.
#   Start / update:  docker compose pull && docker compose up -d

services:
  solenna:
    # :latest is the newest release. Pin a version (e.g. :0.2.0) to stay on it or roll back.
    image: ghcr.io/balazs-kis/solenna:latest
    restart: unless-stopped
    # Hardening, in case someone ever finds a way into the app: it needs no Linux
    # capabilities, writes nothing outside /data, and can never gain privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # Fixed for the container; these override anything in .env.
      SOLENNA_PORT: 8080
      SOLENNA_DATA_DIR: /data
    ports:
      # Host port 37510, bound to localhost only: Caddy on the host terminates
      # HTTPS and forwards here (see README). Don't expose this port publicly.
      # The app listens on 8080 inside the container.
      - "127.0.0.1:37510:8080"
    volumes:
      # The SQLite database lives here; this directory is the only state to back up.
      # The container runs as uid 10001, so the host dir must be writable by it:
      #   mkdir -p data && sudo chown 10001:10001 data
      - ./data:/data
