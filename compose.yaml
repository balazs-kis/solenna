services:
  solenna:
    build: .
    image: solenna:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed for the container; these override anything in .env.
      SOLENNA_PORT: 8080
      SOLENNA_DATA_DIR: /data
    ports:
      # Bound to localhost only: the reverse proxy on the host terminates HTTPS
      # and forwards here. Don't expose this port publicly.
      - "127.0.0.1:8080:8080"
    volumes:
      # The SQLite database lives here; this directory is the only state to back up.
      # The container runs as uid 10001, so the host dir must be writable by it:
      #   mkdir -p data && sudo chown 10001:10001 data
      - ./data:/data
